name: ZTV Release (all platforms)

# 手动触发或推送 v* 标签时构建各平台安装包，并发布到 GitHub Release。
# 产物：Android TV / Android 手机 / Windows / Ubuntu / macOS(.dmg) / iOS Xcode 工程 /
#       鸿蒙 NEXT 可安装 Web 包（PWA）。
# iOS 真机 IPA 需 Apple 签名：配置 EXPO_TOKEN + APPLE_ID/ASC_API_KEY 后，
# 下方的 ios-ipa job 会自动构建；未配置时该 job 跳过，仍交付 iOS 工程源码。
# 部署到自己的仓库后，UpdateConfig.ts 中的仓库地址需与之保持一致。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  android-tv:
    name: Android TV APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Prebuild (TV)
        run: yarn prebuild
      - name: Build release APK
        run: yarn build
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/ZTV-v${{ needs.version.outputs.version }}-android-tv.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: artifacts/*.apk

  android:
    name: Android phone/tablet APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Prebuild (mobile) — 不设置 EXPO_TV，生成普通 Android 工程
        run: |
          npx expo prebuild --platform android --clean
          yarn copy-config
          # 手机工程没有 Leanback 横幅资源，移除 TV 专用 banner 引用（TV 构建保持原样）
          sed -i 's/ android:banner="@drawable\/tv_banner"//' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/ZTV-v${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk

  desktop:
    name: Desktop installers
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            pattern: "desktop/release/*.exe"
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            pattern: "desktop/release/*.deb"
            name: ubuntu
          - os: macos-latest
            script: dist:mac
            pattern: "desktop/release/*.dmg"
            name: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install app dependencies
        run: yarn install --frozen-lockfile
      - name: Export web bundle
        run: npx expo export --platform web --output-dir desktop/web-build
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.pattern }}

  harmony-web:
    name: HarmonyOS NEXT web package (PWA)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Export web bundle (含 manifest.json，含折叠屏/鸿蒙适配)
        run: npx expo export --platform web --output-dir harmony-web-build
      - name: Package web bundle
        run: |
          mkdir -p artifacts
          cd harmony-web-build
          zip -r -q "../artifacts/ZTV-v${{ needs.version.outputs.version }}-harmony-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-web
          path: artifacts/*.zip

  ios-project:
    name: iOS Xcode project (iPhone / iPad)
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Prebuild iOS (no EXPO_TV => iPhone/iPad, not tvOS)
        # 关键：完全不设置 EXPO_TV。设为空串会让 config-tv 插件的 boolish 抛
        # GetEnv.NoBoolean 错误；unset 才能保证生成普通 iOS 工程而非 tvOS。
        run: |
          unset EXPO_TV
          npx expo prebuild --platform ios --clean
      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update
      - name: Package Xcode project
        run: |
          mkdir -p artifacts
          cd ios
          zip -r -q "../artifacts/ZTV-v${{ needs.version.outputs.version }}-ios-xcode-project.zip" \
            . -x 'Pods/*' -x 'build/*' -x '*.xcuserdatad/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: artifacts/*.zip

  ios-ipa:
    name: iOS IPA (EAS, signed) — optional
    runs-on: ubuntu-latest
    needs: version
    # 只有在仓库配置了 EXPO_TOKEN 后才运行；未配置时跳过，不影响其他平台发布。
    if: ${{ vars.ENABLE_IOS_EAS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build iOS IPA via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          unset EXPO_TV
          eas build --platform ios --profile production --non-interactive --output artifact.json
      - name: Download IPA and stage
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          URL=$(node -p "require('./artifact.json').artifacts.buildUrl")
          curl -L -H "Authorization: Bearer $EXPO_TOKEN" -o "artifacts/ZTV-v${{ needs.version.outputs.version }}-ios.ipa" "$URL"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/*.ipa

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, android-tv, android, desktop, harmony-web, ios-project, ios-ipa]
    if: ${{ always() && needs.android-tv.result == 'success' && needs.android.result == 'success' && needs.desktop.result == 'success' && needs.harmony-web.result == 'success' && needs.ios-project.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ZTV v${{ needs.version.outputs.version }}
          body: |
            ZTV v${{ needs.version.outputs.version }}

            - ZTV-v${{ needs.version.outputs.version }}-android-tv.apk — Android TV（联想/乐视等）
            - ZTV-v${{ needs.version.outputs.version }}-android.apk — Android 手机/平板 / HarmonyOS 4.x（兼容 APK）
            - ZTV-v${{ needs.version.outputs.version }}-harmony-web.zip — HarmonyOS NEXT / 三折叠屏 PWA 离线包（解压后用浏览器打开，可添加到桌面）
            - ZTV-v${{ needs.version.outputs.version }}-windows-setup.exe — Windows x64
            - ZTV-v${{ needs.version.outputs.version }}-linux-amd64.deb — Ubuntu x64
            - ZTV-v${{ needs.version.outputs.version }}-macos-universal.dmg — macOS 苹果电脑（Intel / Apple Silicon 通用）
            - ZTV-v${{ needs.version.outputs.version }}-ios-xcode-project.zip — iOS Xcode 工程（iPhone/iPad，需自行签名编译/上架）
            - ZTV-v${{ needs.version.outputs.version }}-ios.ipa — iOS 真机安装包（配置 EAS 凭证后自动生成）

            ### iOS 说明
            iOS 真机安装包（IPA）按 Apple 规定必须由开发者证书签名。默认交付可直接用 Xcode 打开的工程源码，
            下载后用个人 Apple ID 免费签名即可安装到自己的 iPhone/iPad，或用付费开发者账号上架 App Store。
            如已在仓库配置 EXPO_TOKEN 开发者令牌，ios-ipa job 会自动产出已签名的真机 IPA。

            ### 鸿蒙与折叠屏说明
            - HarmonyOS 4.x / 荣耀 MagicOS：直接安装 android.apk，系统识别为鸿蒙兼容模式。
            - HarmonyOS NEXT：下载 harmony-web.zip，解压后通过浏览器打开并可「添加到桌面」使用。
            - 三折叠 / 二折叠 / 单屏手机 / 平板 / 电视 / 机顶盒：界面随窗口尺寸实时切换网格密度与导航样式。
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
